[project]
name = "google-agent-harness"
version = "0.1.0"
description = "Baseline agent harness for Google - Agent Harness on Physical-Engineering's Last Exam"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "openai==3.26.1",
    "websockets>=13.0",
    "dotenv>=0.9.9",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.0",
    "pymupdf>=2.1",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    # Ajoutez ici les bibliothèques métier (ex. pandas, numpy) une fois que vous avez accès à PyPI
    "ifcopenshell>=0.9.0.post1",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src"]
