[project]
name = "google-agent-harness"
version = "0.1.0"
description = "Baseline agent harness for Google - Agent Harness on Physical-Engineering's Last Exam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.0",
    "pymupdf>=2.1",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    # Ajoutez ici les bibliothèques métier (ex. pandas, numpy) une fois que vous avez accès à PyPI
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src"]
